# =============================================================================
# AuraFit – Local Development Infrastructure
# Usage: docker compose up -d
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 – Primary data store
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aurafit-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"                       # host 5433 → container 5432
    environment:
      POSTGRES_USER: aurafit
      POSTGRES_PASSWORD: aurafit123
      POSTGRES_DB: aurafit_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurafit -d aurafit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin 4 – Optional database admin UI (http://localhost:5050)
  # Login: truongthainhuu@gmail.com / admin123
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aurafit-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: truongthainhuu@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
