# =============================================================================
# AuraFit – PROD Profile (Template – do NOT commit real credentials)
# =============================================================================
# Activate via: --spring.profiles.active=prod
# Inject secrets through environment variables or a vault.
# =============================================================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      pool-name: AuraFitHikariPool

  jpa:
    hibernate:
      ddl-auto: validate                  # NEVER auto-alter in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    # Allow Vercel frontend, production domain, and localhost for development
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://aurafitstore.vercel.app,https://aurafit-frontend.vercel.app,http://localhost:5173}

# -- SePay ---------------------------------------------------------------------
sepay:
  api-key: ${SEPAY_API_KEY:}
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
  va-account: ${SEPAY_VA_ACCOUNT:}
  vietqr-base-url: ${SEPAY_VIETQR_BASE_URL:}
