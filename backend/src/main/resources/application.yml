# =============================================================================
# AuraFit – Shared / Default Configuration
# =============================================================================
# This file contains properties that are common across ALL profiles.
# Profile-specific overrides live in application-{profile}.yml.
# Activate a profile via: --spring.profiles.active=dev
# =============================================================================

server:
  port: 8080

spring:
  # -- Default profile used when none is explicitly set ----------------------
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  jpa:
    open-in-view: false                   # Disable OSIV – avoid lazy-loading surprises
    properties:
      hibernate:
        format_sql: true

# -- JWT Configuration -------------------------------------------------------
# These are safe defaults for LOCAL development only.
# In production, inject via environment variables or a secrets manager.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000         # 24 hours (ms)
  refresh-token-expiration: 604800000     # 7 days     (ms)

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://aurafitstore.vercel.app}
  upload:
    image-folder: ${UPLOAD_IMAGE_FOLDER:aurafit}
    max-image-size-bytes: ${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}

ghn:
  api:
    url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_API_TOKEN:}
  shop:
    id: ${GHN_SHOP_ID:}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-ms: 15000
