# =============================================================================
# AuraFit – Shared / Default Configuration
# =============================================================================
# This file contains properties that are common across ALL profiles.
# Profile-specific overrides live in application-{profile}.yml.
# Activate a profile via: --spring.profiles.active=dev
# =============================================================================

server:
  port: ${PORT:8080}

spring:
  profiles:
    active: dev

  config:
    import:
      - optional:file:backend/.env[.properties]
      - optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# -- JWT Configuration -------------------------------------------------------
# These are safe defaults for LOCAL development only.
# In production, inject via environment variables or a secrets manager.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}


app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  upload:
    image-folder: ${UPLOAD_IMAGE_FOLDER:aurafit}
    max-image-size-bytes: ${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}


ai:
  enabled: ${AI_ENABLED:false}
  provider-base-url: ${AI_PROVIDER_BASE_URL:}
  provider-api-key: ${AI_PROVIDER_API_KEY:}
  embedding-model: ${AI_EMBEDDING_MODEL:}
  enrichment-delay-ms: ${AI_ENRICHMENT_DELAY_MS:5000}
  chat-model: ${AI_CHAT_MODEL:}
  fallback-embedding-dimension: ${AI_FALLBACK_EMBEDDING_DIMENSION:64}
  default-recommendation-limit: ${AI_DEFAULT_RECOMMENDATION_LIMIT:6}
  candidate-pool-size: ${AI_CANDIDATE_POOL_SIZE:24}
  profile-top-tag-limit: ${AI_PROFILE_TOP_TAG_LIMIT:5}
  profile-stale-minutes: ${AI_PROFILE_STALE_MINUTES:60}
  reasoning-ranking-enabled: ${AI_REASONING_RANKING_ENABLED:false}
  similar-products-reasoning-enabled: ${AI_SIMILAR_PRODUCTS_REASONING_ENABLED:false}
  homepage-reasoning-enabled: ${AI_HOMEPAGE_REASONING_ENABLED:false}
  llm-explanation-enabled: ${AI_LLM_EXPLANATION_ENABLED:false}
  provider-connect-timeout-millis: ${AI_PROVIDER_CONNECT_TIMEOUT_MS:2000}
  provider-read-timeout-millis: ${AI_PROVIDER_READ_TIMEOUT_MS:6000}
  provider-max-retries: ${AI_PROVIDER_MAX_RETRIES:1}
  reasoning-connect-timeout-millis: ${AI_REASONING_CONNECT_TIMEOUT_MS:2000}
  reasoning-read-timeout-millis: ${AI_REASONING_READ_TIMEOUT_MS:9000}
  reasoning-rate-limit-per-minute: ${AI_REASONING_RATE_LIMIT_PER_MINUTE:12}
  reasoning-circuit-failure-threshold-percent: ${AI_REASONING_CIRCUIT_FAILURE_THRESHOLD_PERCENT:30}
  reasoning-circuit-window-minutes: ${AI_REASONING_CIRCUIT_WINDOW_MINUTES:5}
  reasoning-circuit-cooldown-minutes: ${AI_REASONING_CIRCUIT_COOLDOWN_MINUTES:10}
  reasoning-circuit-minimum-calls: ${AI_REASONING_CIRCUIT_MINIMUM_CALLS:10}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-ms: ${GEMINI_TIMEOUT_MS:15000}
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}

  stylist:
    intent-extraction-prompt: >-
      Bạn là bộ trích xuất ý định cho stylist thời trang AuraFit.
      Chỉ trả về đúng một JSON object theo schema dưới đây, không markdown, không giải thích và không thêm chữ ngoài JSON:
      {
        "category": string|null,
        "requestedItem": string|null,
        "style": string|null,
        "occasion": string|null,
        "season": string|null,
        "color": string|null,
        "gender": string|null,
        "tags": array<string>|null,
        "minBudget": number|null,
        "maxBudget": number|null
      }

      category phải là category path dạng slug tiếng Việt không dấu, ví dụ "su-kien" hoặc "cosplay".
      Nếu không chắc category path tồn tại trong AuraFit thì để null, không tự tạo path mới.
      requestedItem là loại mặt hàng cốt lõi khách đang yêu cầu rõ ràng, ví dụ "bikini", "áo dài", "váy cưới"; không kèm màu sắc, phong cách hoặc giới tính.
      requestedItem vẫn phải được ghi nhận kể cả khi mặt hàng hoặc category đó có thể chưa tồn tại trong AuraFit.
      Chỉ điền requestedItem khi tin nhắn hiện tại trực tiếp nhắc hoặc yêu cầu mặt hàng; không kế thừa requestedItem từ lịch sử.
      Chỉ điền thông tin có thể xác định rõ từ lời người dùng và ngữ cảnh gần nhất.
      Chỉ kế thừa field từ lịch sử khi tin hiện tại thực sự là câu hỏi nối tiếp.
      Nếu tin hiện tại đã nêu rõ sản phẩm hoặc nhu cầu mới, không mang occasion, color, style hay tags cũ sang.
      Field nào không xác định được thì bắt buộc để null. Không được suy đoán hoặc bịa dữ liệu.
      Giá tiền dùng số VND, không kèm ký hiệu hoặc dấu phân cách.

      Ví dụ 1:
      Input: "Mình cần đồ nữ màu đỏ để đi tiệc, ngân sách tối đa 500 nghìn"
      Output: {"category":"su-kien","requestedItem":null,"style":null,"occasion":"tiệc","season":null,"color":"đỏ","gender":"nữ","tags":null,"minBudget":null,"maxBudget":500000}

      Ví dụ 2:
      Input: "Tìm trang phục cosplay phong cách dễ thương"
      Output: {"category":"cosplay","requestedItem":null,"style":"dễ thương","occasion":null,"season":null,"color":null,"gender":null,"tags":null,"minBudget":null,"maxBudget":null}

      Ví dụ 3:
      Input: "Shop có bikini không?"
      Output: {"category":null,"requestedItem":"bikini","style":null,"occasion":null,"season":null,"color":null,"gender":null,"tags":null,"minBudget":null,"maxBudget":null}

ai-analyst:
  low-stock-threshold: ${AI_ANALYST_LOW_STOCK_THRESHOLD:3}
  unmet-demand-min-count: ${AI_ANALYST_UNMET_DEMAND_MIN_COUNT:2}


ghn:
  api:
    url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_API_TOKEN:}

  shop:
    id: ${GHN_SHOP_ID:}

# ── OpenAI Virtual Try-On ────────────────────────────────────────────────────
openai:
  api-key: ${OPENAI_API_KEY:}
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
  image-size: ${OPENAI_IMAGE_SIZE:1024x1024}
  connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:120000}
