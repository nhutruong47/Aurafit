# =============================================================================
# AuraFit – Shared / Default Configuration
# =============================================================================
# This file contains properties that are common across ALL profiles.
# Profile-specific overrides live in application-{profile}.yml.
# Activate a profile via: --spring.profiles.active=dev
# =============================================================================

server:
  port: 8080

spring:
  # -- Default profile used when none is explicitly set ----------------------
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

  jpa:
    open-in-view: false                   # Disable OSIV – avoid lazy-loading surprises
    properties:
      hibernate:
        format_sql: true

# -- JWT Configuration -------------------------------------------------------
# These are safe defaults for LOCAL development only.
# In production, inject via environment variables or a secrets manager.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000         # 24 hours (ms)
  refresh-token-expiration: 604800000     # 7 days     (ms)

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  upload:
    image-folder: ${UPLOAD_IMAGE_FOLDER:aurafit}
    max-image-size-bytes: ${UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}

ai:
  enabled: ${AI_ENABLED:false}
  provider-base-url: ${AI_PROVIDER_BASE_URL:}
  provider-api-key: ${AI_PROVIDER_API_KEY:}
  # TODO: reserved for LLM reasoning phase - not yet wired to runtime logic.
  embedding-model: ${AI_EMBEDDING_MODEL:}
  chat-model: ${AI_CHAT_MODEL:}
  # TODO: reserved for LLM reasoning phase - not yet wired to runtime logic.
  fallback-embedding-dimension: ${AI_FALLBACK_EMBEDDING_DIMENSION:64}
  # TODO: reserved for LLM reasoning phase - not yet wired to runtime logic.
  default-recommendation-limit: ${AI_DEFAULT_RECOMMENDATION_LIMIT:6}
  # TODO: reserved for LLM reasoning phase - not yet wired to runtime logic.
  candidate-pool-size: ${AI_CANDIDATE_POOL_SIZE:24}
  # TODO: reserved for LLM reasoning phase - not yet wired to runtime logic.
  profile-top-tag-limit: ${AI_PROFILE_TOP_TAG_LIMIT:5}
  # TODO: reserved for LLM reasoning phase - not yet wired to runtime logic.
  profile-stale-minutes: ${AI_PROFILE_STALE_MINUTES:60}
  reasoning-ranking-enabled: ${AI_REASONING_RANKING_ENABLED:false}
  similar-products-reasoning-enabled: ${AI_SIMILAR_PRODUCTS_REASONING_ENABLED:false}
  homepage-reasoning-enabled: ${AI_HOMEPAGE_REASONING_ENABLED:false}
  llm-explanation-enabled: ${AI_LLM_EXPLANATION_ENABLED:false}
  provider-connect-timeout-millis: ${AI_PROVIDER_CONNECT_TIMEOUT_MS:2000}
  provider-read-timeout-millis: ${AI_PROVIDER_READ_TIMEOUT_MS:6000}
  provider-max-retries: ${AI_PROVIDER_MAX_RETRIES:1}
  reasoning-connect-timeout-millis: ${AI_REASONING_CONNECT_TIMEOUT_MS:2000}
  reasoning-read-timeout-millis: ${AI_REASONING_READ_TIMEOUT_MS:9000}
  reasoning-rate-limit-per-minute: ${AI_REASONING_RATE_LIMIT_PER_MINUTE:12}
  reasoning-circuit-failure-threshold-percent: ${AI_REASONING_CIRCUIT_FAILURE_THRESHOLD_PERCENT:30}
  reasoning-circuit-window-minutes: ${AI_REASONING_CIRCUIT_WINDOW_MINUTES:5}
  reasoning-circuit-cooldown-minutes: ${AI_REASONING_CIRCUIT_COOLDOWN_MINUTES:10}
  reasoning-circuit-minimum-calls: ${AI_REASONING_CIRCUIT_MINIMUM_CALLS:10}
