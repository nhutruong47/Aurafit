# =============================================================================
# AuraFit – DEV Profile (Local Docker PostgreSQL)
# =============================================================================
# Activated by: --spring.profiles.active=dev   (default in application.yml)
# Requires:     docker compose up -d
# =============================================================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: update                   # Auto-create/alter tables in dev
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        generate_statistics: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/categories-backfill.sql
      separator: "@@"

  # -- Gmail SMTP (App Password) -----------------------------------------------
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# -- SePay Webhook ------------------------------------------------------------
sepay:
  api-key: ${SEPAY_API_KEY:}
  webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
  va-account: ${SEPAY_VA_ACCOUNT:}
  vietqr-base-url: ${SEPAY_VIETQR_BASE_URL:}
